[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "option-platform"
version = "0.1.0"
description = "Provider-neutral option strategy research and paper-trading platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[project.scripts]
option-platform-tsetmc = "option_platform.runtime.market_collector:run_cli"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/option_platform"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests",
  "contract: provider and broker contract tests",
  "integration: PostgreSQL integration tests",
  "replay: deterministic replay tests",
  "failure: failure and recovery tests",
  "e2e: complete vertical-slice tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/option_platform/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["option_platform"]
